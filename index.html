<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Shri AI</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">Shri AI <span class="tag">Chat</span></div>
    <nav>
      <a href="index.html" class="active">Chat</a>
      <a href="admin.html">Admin</a>
    </nav>
  </header>

  <main class="container chat-page">
    <section class="card chat-card">
      <div class="chat-head">
        <div class="avatar">S</div>
        <div>
          <div class="chat-title">Shri AI</div>
          <div class="chat-sub">Ask anything - talk, analyze, predict, classify</div>
        </div>
        <div class="chat-status" id="chat-status">online</div>
      </div>

      <div class="chat" id="chat">
        <div class="msg bot">Hi! I am Shri AI. Ask me anything - general chat, sentiment of a review, a tip prediction, feature classification, or how ML / DL / DS / NLP / CV work.</div>
      </div>

      <div class="chips" id="chips">
        <button class="chip" data-q="What can you do?">What can you do?</button>
        <button class="chip" data-q="What is deep learning?">What is deep learning?</button>
        <button class="chip" data-q="sentiment: this movie was absolutely wonderful, I loved it">Test sentiment</button>
        <button class="chip" data-q="tip for 45 dollars, 5 people">Predict a tip</button>
      </div>

      <form id="chat-form" class="chat-form">
        <input id="chat-input" type="text" placeholder="Message Shri AI..." autocomplete="off" />
        <button type="submit">Send</button>
      </form>
    </section>
  </main>

  <footer class="footer">Shri AI - one model, five domains</footer>
  <script src="js/app.js"></script>
</body>
</html>
